<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine’s</title>
    <meta name="theme-color" content="#ff4d8d" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="index.css" />
    <style>
      body {
        background: radial-gradient(900px 600px at 30% 10%, rgba(255, 119, 184, 0.16), transparent 55%),
          radial-gradient(900px 600px at 85% 40%, rgba(216, 132, 177, 0.16), transparent 56%),
          linear-gradient(180deg, #f1b0c5, #d888b2);
      }

      .page {
        min-height: 100svh;
        display: grid;
        place-items: center;
        grid-template-columns: 1fr;
        padding: 26px 18px 44px;
      }

      .chooser {
        width: min(860px, 100%);
        text-align: center;
      }

      .title {
        margin: 10px 10px 12px;
        font-size: clamp(30px, 4.6vw, 54px);
        letter-spacing: 0.9px;
        color: rgba(30, 20, 30, 0.84);
        font-weight: 900;
        text-shadow: 0 18px 60px rgba(0, 0, 0, 0.14);
        transform: translateY(8px);
        opacity: 0;
        animation: floatIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .subtitle {
        margin: 0 10px 24px;
        color: rgba(30, 20, 30, 0.68);
        font-weight: 900;
        letter-spacing: 0.2px;
        transform: translateY(8px);
        opacity: 0;
        animation: floatIn 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms forwards;
      }

      @keyframes floatIn {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(14px, 3vw, 22px);
        justify-content: center;
        align-items: center;
        width: min(520px, 100%);
        margin: 0 auto;
      }

      .choice {
        aspect-ratio: 1 / 1;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.48);
        background: rgba(255, 255, 255, 0.38);
        box-shadow: 0 26px 70px rgba(0, 0, 0, 0.22);
        display: grid;
        place-items: center;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        transform: translateY(10px);
        opacity: 0;
        animation: popIn 620ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .choice:nth-child(1) {
        animation-delay: 120ms;
      }
      .choice:nth-child(2) {
        animation-delay: 200ms;
      }
      .choice:nth-child(3) {
        animation-delay: 280ms;
      }
      .choice:nth-child(4) {
        animation-delay: 360ms;
      }

      @keyframes popIn {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .choice::before {
        content: "";
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.45), transparent 55%),
          radial-gradient(circle at 70% 60%, rgba(255, 77, 141, 0.22), transparent 58%);
        transform: rotate(-10deg);
        opacity: 0.75;
        pointer-events: none;
      }

      .choice:hover {
        transform: translateY(-2px) scale(1.01);
        background: rgba(255, 255, 255, 0.5);
      }

      .choice:active {
        transform: translateY(0);
      }

      .choice:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(255, 77, 141, 0.35), 0 18px 34px rgba(0, 0, 0, 0.18);
      }

      .choice img {
        width: 74%;
        height: 74%;
        object-fit: contain;
        display: block;
        position: relative;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.18));
      }

      .back {
        margin-top: 22px;
        font-size: 16px;
      }

      .hint {
        margin: 16px 0 0;
        color: rgba(30, 20, 30, 0.6);
        font-weight: 900;
        font-size: 13px;
      }

      @media (max-width: 420px) {
        .choices {
          width: min(420px, 100%);
        }
      }
    </style>
  </head>
  <body data-vfx="sparkles" data-vfx-count="12" data-theme-ready="0">
    <main class="page" role="main">
      <section class="chooser" aria-label="Choose one to begin">
        <h1 class="title">Choose one to begin</h1>
        <p class="subtitle">a tiny love menu, made just for you</p>

        <div class="choices" role="group" aria-label="Choices">
          <button class="choice" href="valentines.html" type="button" aria-label="Read my letter">
            <img
              src="https://media.tenor.com/i9yvlqt2aYoAAAAj/peach-goma-peach-and-goma.gif"
              alt="Cute cat with hearts"
              loading="eager"
            />
          </button>

          <button class="choice" href="memories.html" type="button" aria-label="Our memories">
            <img
              src="https://media1.tenor.com/m/lIv8LL5SHRIAAAAd/peachandgoma-peach.gif"
              alt="Cute cat"
              loading="eager"
            />
          </button>

          <button class="choice" href="lovesong.html" type="button" aria-label="Play our song">
            <img
              src="https://media.tenor.com/4IjQIPhZG0oAAAAj/%E3%82%82%E3%81%A1%E3%81%AD%E3%81%93-%E3%81%94%E3%81%BE%E3%81%B4%E3%83%BC%E3%81%A1.gif"
              alt="Cute cat"
              loading="eager"
            />
          </button>

          <button class="choice" href="gift.html" type="button" aria-label="Open your gift">
            <img
              src="https://media.tenor.com/TqVuGQf3hN4AAAAj/%E5%9B%B4%E7%9D%80%E8%A2%AB%E5%8D%95%E5%8F%96%E6%9A%96-peach-cat-and-goma.gif"
              alt="Cute cat"
              loading="eager"
            />
          </button>
        </div>

        <p class="hint">Tap a circle. (It’s safe, I promise.)</p>

        <a class="v-btn back" href="index.html">Back to passcode</a>
      </section>
    </main>

    <script src="theme.js"></script>

    <script>
      // Simple behavior so the buttons feel interactive.
      document.querySelectorAll('.choice').forEach((btn, i) => {
        btn.addEventListener('click', () => {
          // Redirect using the button's href attribute (matches your markup).
          const href = btn.getAttribute('href');
          if (href) window.location.href = href;
        });
      });
    </script>
  </body>
</html>
