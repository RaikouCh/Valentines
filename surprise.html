<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Surprise</title>
    <meta name="theme-color" content="#ff4d8d" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      :root {
        --pink-1: #f7b1c8;
        --pink-2: #d884b1;
        --ink: rgba(25, 18, 25, 0.9);
        --muted: rgba(25, 18, 25, 0.62);
        --stroke: rgba(60, 20, 45, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: Delius, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background:
          radial-gradient(900px 600px at 18% 10%, rgba(255, 255, 255, 0.22), transparent 58%),
          radial-gradient(900px 600px at 82% 38%, rgba(255, 255, 255, 0.18), transparent 58%),
          linear-gradient(180deg, var(--pink-1), var(--pink-2));
        color: var(--ink);
        overflow-x: hidden;
      }

      .page {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 18px;
      }

      .card {
        width: min(820px, 100%);
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.25);
        padding: 26px 18px 18px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(closest-side at 16% 18%, rgba(255, 255, 255, 0.55), transparent 60%),
          radial-gradient(closest-side at 86% 32%, rgba(255, 255, 255, 0.28), transparent 58%),
          radial-gradient(closest-side at 50% 100%, rgba(255, 255, 255, 0.22), transparent 60%);
        opacity: 0.85;
        pointer-events: none;
      }

      .content {
        position: relative;
      }

      h1 {
        margin: 8px 0 10px;
        font-size: clamp(26px, 4vw, 48px);
      }

      .msg {
        margin: 0 auto;
        width: min(620px, 100%);
        line-height: 1.7;
        font-weight: 800;
        color: rgba(25, 18, 25, 0.86);
      }

      .small {
        margin: 12px 0 0;
        color: var(--muted);
        font-weight: 900;
        font-size: 13px;
      }

      .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .btn {
        font-weight: 900;
      }

      .heartline {
        margin: 12px auto 0;
        width: min(520px, 100%);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(140, 40, 85, 0.38), transparent);
      }
    </style>
  </head>
  <body data-vfx="confetti" data-vfx-count="20" data-theme-ready="0">
    <main class="page" role="main">
      <section class="card" aria-label="Surprise">
        <div class="content">
          <h1>Surprise, my love</h1>
          <p class="msg">
            I just want you to know: I’m so proud of you, I’m so thankful for you, and I still get the same
            butterflies when I think about us. You are my favorite person.
          </p>
          <div class="heartline" aria-hidden="true"></div>
          <p class="small"></p>

          <div class="btn-row">
            <a class="v-btn btn" href="lovesong.html">Back</a>
            <a class="v-btn btn" href="anniversary.html">Menu</a>
            <a class="v-btn btn" href="memories.html">Memories</a>
          </div>
        </div>
      </section>
    </main>

    <script src="theme.js"></script>
  </body>
</html>
