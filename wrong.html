<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrong Password</title>
    <meta name="theme-color" content="#ff4d8d" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      :root {
        --bg1: #f1b0c5;
        --bg2: #d888b2;
        --text: rgba(30, 20, 30, 0.9);
        --ring: rgba(255, 77, 141, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: Delius, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg1), var(--bg2));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .wrap {
        text-align: center;
        max-width: 720px;
        display: grid;
        place-items: center;
      }

      .gif {
        width: min(360px, 80vw);
        height: auto;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.25));
        transform: translateY(10px);
        opacity: 0;
        animation: popIn 620ms cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      @keyframes popIn {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .msg {
        margin: 50px 0 0;
        font-weight: 700;
        font-size: clamp(20px, 3vw, 34px);
        letter-spacing: -0.2px;
        text-shadow: 0 18px 60px rgba(0, 0, 0, 0.14);
      }

      .try-again {
        margin-top: 50px;
        font-size: 18px;
      }
    </style>
  </head>
  <body data-vfx="hearts" data-vfx-count="14" data-theme-ready="0">
    <main class="wrap" role="main" aria-label="Wrong password">
      <img
        class="gif"
        src="https://media.tenor.com/VxixtsQjIRAAAAAi/chibi-cat-mochi-cat.gif"
        alt="Crying cat"
        loading="eager"
      />
      <p class="msg">Wrong password, you sure you're my baby?</p>
      <a class="v-btn try-again" href="index.html" aria-label="Try again">Try Again</a>
    </main>

    <script src="theme.js"></script>
  </body>
</html>
